name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go test and vet
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Measure authorization accuracy
        run: |
          go run ./cmd/authbench -repeat 3 -out benchmarks/authz-ci-status.json
          go run ./cmd/authbench -assertions -repeat 3 -out benchmarks/authz-ci-assertions.json
