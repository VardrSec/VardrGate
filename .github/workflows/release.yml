name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - VERSION
      - scripts/release_archive.py
      - scripts/test_release_archive.py

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false
      - name: Verify version, tag and release notes
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [ "$REF_TYPE" = tag ]; then test "$REF_NAME" = "$tag"; fi
          test -f "docs/releases/$tag.md"
          grep -Fq "## [$version]" CHANGELOG.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify deterministic archive writer
        run: python -m unittest discover -s scripts -p 'test_release_archive.py'
      - name: Build twice offline, compare and archive binary
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOFLAGS: ""
        run: |
          set -euo pipefail
          repository="$PWD"
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          binary=vardrgate
          if [ "$GOOS" = windows ]; then binary=vardrgate.exe; fi
          archive="vardrgate_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
          suffix=tar.gz
          if [ "$GOOS" = windows ]; then suffix=zip; fi
          mkdir dist
          for attempt in a b; do
            work="$RUNNER_TEMP/gate-$attempt"
            mkdir -p "$work/source" "$work/stage"
            git archive HEAD | tar -xf - -C "$work/source"
            export GOCACHE="$work/cache" GOMODCACHE="$work/modules"
            cd "$work/source"
            go mod download all
            go mod verify
            cmp go.mod "$repository/go.mod"
            cmp go.sum "$repository/go.sum"
            GOPROXY=off go build -mod=readonly -trimpath -buildvcs=false -ldflags "-s -w -X main.version=$RELEASE_TAG" -o "$work/stage/$binary" ./cmd/vardrgate
            if [ "$GOOS/$GOARCH" = linux/amd64 ]; then test "$("$work/stage/$binary" version)" = "$RELEASE_TAG"; fi
            python "$repository/scripts/release_archive.py" --source "$work/source" --stage "$work/stage" --binary "$binary" --commit "$commit" --tree "$tree" --version "$RELEASE_TAG" --output "$work/$archive.$suffix"
            cd "$repository"
          done
          cmp "$RUNNER_TEMP/gate-a/stage/$binary" "$RUNNER_TEMP/gate-b/stage/$binary"
          cmp "$RUNNER_TEMP/gate-a/$archive.$suffix" "$RUNNER_TEMP/gate-b/$archive.$suffix"
          cp "$RUNNER_TEMP/gate-a/$archive.$suffix" dist/
          echo "Verified two independent binary builds and canonical archives for $GOOS/$GOARCH" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vardrgate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Checksums and build provenance
    if: github.ref_type == 'tag'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vardrgate-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum vardrgate_* > SHA256SUMS
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - name: Publish archives and checksums
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "VardrGate $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
